version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: infrasentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/infrasentinel
      JWT_SECRET_KEY: replace_with_secure_secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OBJECT_STORAGE_BACKEND: local
      OBJECT_STORAGE_BUCKET: infrasentinel
      OBJECT_STORAGE_BASE_URL: http://localhost:9000
      ENVIRONMENT: development
    depends_on:
      - db
      - redis
    ports:
      - "8001:8001"

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.infra.celery_app.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/infrasentinel
      JWT_SECRET_KEY: replace_with_secure_secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OBJECT_STORAGE_BACKEND: local
      OBJECT_STORAGE_BUCKET: infrasentinel
      OBJECT_STORAGE_BASE_URL: http://localhost:9000
      ENVIRONMENT: development
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.infra.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/infrasentinel
      JWT_SECRET_KEY: replace_with_secure_secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OBJECT_STORAGE_BACKEND: local
      OBJECT_STORAGE_BUCKET: infrasentinel
      OBJECT_STORAGE_BASE_URL: http://localhost:9000
      ENVIRONMENT: development
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
