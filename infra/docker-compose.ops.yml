version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: infrasentinel
      POSTGRES_PASSWORD: infrasentinel
      POSTGRES_DB: infrasentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata_ops:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://infrasentinel:infrasentinel@postgres:5432/infrasentinel
      JWT_SECRET_KEY: demo_secret
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  ai_worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python -m app.workers.ai_worker
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

  processor:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python -m app.workers.processor
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://infrasentinel:infrasentinel@postgres:5432/infrasentinel
      JWT_SECRET_KEY: demo_secret
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

volumes:
  pgdata_ops:
